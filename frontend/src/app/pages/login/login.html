<div class="container">
  <div class="card">
    <h2>Iniciar Sesión</h2>

    <div *ngIf="error" class="error">{{ error }}</div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>

      <button type="submit" class="submit">Entrar</button>
      <div class="demo-login">
        <button type="button" class="demo-button" (click)="loginDemo('admin')">Ingresar como Admin (Demo)</button>
        <button type="button" class="demo-button" (click)="loginDemo('editor')">Ingresar como Editor (Demo)</button>
        <button type="button" class="demo-button" (click)="loginDemo('viewer')">Ingresar como Viewer (Demo)</button>
      </div>
    </form>

    <p>¿No tenés una cuenta? <a routerLink="/register">Registrate</a></p>
  </div>
</div>
