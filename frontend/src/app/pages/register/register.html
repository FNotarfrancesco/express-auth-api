<div class="container">
  <div class="card">
    <h2>Registrarse</h2>

    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="success" class="success">{{ success }}</div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="name" name="name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>

      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <input type="password" [(ngModel)]="confirm_password" name="confirm_password" required>
      </div>

      <div class="form-group">
        <label>Código de registro</label>
        <input type="text" [(ngModel)]="code" name="code" required>
      </div>

      <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tenes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
